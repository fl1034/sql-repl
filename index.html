<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/sql-repl.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQL/REPL: DuckDB in your browser</title>
    <meta
      name="description"
      content="A fast, local-first DuckDB interface that runs entirely in your browser. Query CSV/Parquet/JSON, build charts, and share a link that reproduces the whole analysis. No backend, no signup."
    />

    <!-- Open Graph (Facebook, Slack, Discord, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SQL/REPL" />
    <meta property="og:title" content="SQL/REPL: DuckDB in your browser" />
    <meta
      property="og:description"
      content="Query data and build charts with DuckDB, entirely in your browser. Share a link that reproduces the whole analysis. No backend, no signup."
    />
    <meta property="og:url" content="https://fl1034.github.io/sql-repl/" />
    <meta property="og:image" content="https://fl1034.github.io/sql-repl/screenshot.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SQL/REPL: DuckDB in your browser" />
    <meta
      name="twitter:description"
      content="Query data and build charts with DuckDB, entirely in your browser. Share a link that reproduces the whole analysis. No backend, no signup."
    />
    <meta name="twitter:image" content="https://fl1034.github.io/sql-repl/screenshot.png" />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "SQL/REPL",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "description": "A local-first, browser-based DuckDB interface. Query CSV/Parquet/JSON, build charts, and share reproducible analyses with no backend.",
        "url": "https://fl1034.github.io/sql-repl/",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script src="/theme.js"></script>
  </head>
  <body class="h-full antialiased">
    <div id="app" class="h-full"></div>
    <!-- Runtime env (overwritten by the Docker entrypoint; empty default otherwise).
         An external file instead of an injected inline script so the CSP can
         stay free of 'unsafe-inline'. -->
    <script src="/env.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
